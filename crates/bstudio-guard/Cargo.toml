[package]
name = "bstudio-guard"
version = "0.1.0"
description = "b-studio의 막는 검사 판정(읽기 전용 docker, 컨테이너 정책, 시크릿 가림). Node에 의존하지 않는다"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# JS가 JSON.stringify로 넘긴 객체의 키 순서(Object.keys 순서)를 그대로 지키려고 preserve_order를 켠다
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
# 경로 이름 접기(foldName)의 NFKD·NFKC. Node의 normalize와 Unicode 판이 달라 전체 코드 포인트로 견줬다(#1090)
unicode-normalization = "0.1.26"
