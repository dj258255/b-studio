[package]
name = "bstudio-guard"
version = "0.1.0"
description = "b-studio의 막는 검사 판정(읽기 전용 docker, 컨테이너 정책, 시크릿 가림). Node에 의존하지 않는다"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# JS가 JSON.stringify로 넘긴 객체의 키 순서(Object.keys 순서)를 그대로 지키려고 preserve_order를 켠다
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
# 경로 이름 접기(foldName)의 NFKD·NFKC. Node의 normalize와 Unicode 판이 달라 전체 코드 포인트로 견줬다(#1090)
unicode-normalization = "0.1.26"
# spec의 YAML 읽기(ADR-197). 이벤트 API만 쓰고 스칼라 해석·merge·중복 키는 yaml.rs가 직접 한다. 0.3.x는 짧은 기간에 여러 번 나왔으므로 판본을 고정한다
saphyr-parser = "=0.3.3"
# spec의 z.url()(3단계 (b)). Node WHATWG URL과 같은 판정을 위해 bstudio-io와 같은 판본을 쓴다
url = "=2.5.8"
