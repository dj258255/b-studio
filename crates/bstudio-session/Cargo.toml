[package]
name = "bstudio-session"
version = "0.1.0"
description = "b-studio의 세션 기록(이벤트 history·logs)과 그 질의, 세션 파일의 저장·읽기와 저장 예약(Persister). Node를 모른다 — napi 층은 bstudio-node가 얹는다(ADR-203)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bstudio-guard = { path = "../bstudio-guard" }
# 저장 예약의 타이머(time)와 쓰기 줄(sync), 파일 쓰기를 JS 스레드 밖에서 하는 spawn_blocking(rt). 런타임은 부르는 쪽이 준다
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
