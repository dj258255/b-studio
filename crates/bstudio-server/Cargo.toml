[package]
name = "bstudio-server"
version = "0.1.0"
description = "b-studio의 공개 포트를 여는 Rust 앞단(ADR-195 4a). Node 서버를 유닉스 소켓의 자식으로 띄우고 모든 요청을 바꾸지 않고 넘긴다"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bstudio_server"
path = "src/lib.rs"

[[bin]]
name = "bstudio-server"
path = "src/main.rs"

[dependencies]
# 프록시 라이브러리가 Host를 다시 쓰거나 x-forwarded-*를 더하는 기본 동작이 있으면 안 되어(ADR-195 결정 2) hyper의 낮은 층으로 직접 넘긴다.
# 버전은 정확히 고정한다(=x.y.z). 올릴 때는 시험(tests/proxy.rs)이 규칙을 계속 지키는지 본다
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "=1.12.0", features = ["http1", "client", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
http-body-util = "=0.1.5"
# 다른 크레이트와 같은 tokio(Cargo.lock의 1.54.1)를 쓴다
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "io-util", "sync"] }
# 소유자(uid) 확인과 SIGTERM 전달
libc = "0.2"

[dev-dependencies]
tempfile = "3"
