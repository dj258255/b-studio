[package]
name = "bstudio-server"
version = "0.1.0"
description = "b-studio의 공개 포트를 여는 Rust 앞단(ADR-195 4a). Node 서버를 유닉스 소켓의 자식으로 띄우고 모든 요청을 바꾸지 않고 넘긴다"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bstudio_server"
path = "src/lib.rs"

[[bin]]
name = "bstudio-server"
path = "src/main.rs"

[dependencies]
# 프록시 라이브러리가 Host를 다시 쓰거나 x-forwarded-*를 더하는 기본 동작이 있으면 안 되어(ADR-195 결정 2) hyper의 낮은 층으로 직접 넘긴다.
# 버전은 정확히 고정한다(=x.y.z). 올릴 때는 시험(tests/proxy.rs)이 규칙을 계속 지키는지 본다
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "=1.12.0", features = ["http1", "client", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
http-body-util = "=0.1.5"
# 다른 크레이트와 같은 tokio(Cargo.lock의 1.54.1)를 쓴다
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "io-util", "sync"] }
# 소유자(uid) 확인과 SIGTERM 전달
libc = "0.2"
# 인증 판단(ADR-195 4c)이 Node의 `new URL(...)`과 같은 계산을 하려면 WHATWG URL 구현이 필요하다(경로의 점 구간·%2e·역슬래시, Origin의 host·기본 포트). 정확한 버전 고정
url = "=2.5.8"
# 세션 쿠키 서명(HMAC-SHA256)과 접근 토큰 해시(SHA-256)
hmac = "=0.13.0"
sha2 = "=0.11.1"
# 서명(base64url, 패딩 없음)과 쿠키 내용 풀기
base64 = "=0.23.1"
# 쿠키 내용·무효화 기록의 JSON. float_roundtrip은 JS의 JSON.parse와 같은 f64로 읽기 위해(만료 시각 비교)
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3"
