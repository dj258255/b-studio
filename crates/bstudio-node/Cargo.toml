[package]
name = "bstudio-node"
version = "0.1.0"
description = "bstudio-guard·bstudio-io를 Node에 붙이는 napi 층. 형 변환과 비동기·취소 접착만 한다"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
bstudio-guard = { path = "../bstudio-guard" }
bstudio-io = { path = "../bstudio-io" }
serde = "1"
serde_json = "1"
# tokio_rt: async fn을 napi Promise로 노출하고 AbortSignal로 취소한다(ADR-193, 2c-1)
napi = { version = "3", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3"
# abort되면 Notify로 작업 future를 깨워 떨어뜨린다(select!). bstudio-io와 같은 tokio를 쓴다
tokio = { version = "1", features = ["sync", "macros", "rt"] }

[build-dependencies]
napi-build = "2"
